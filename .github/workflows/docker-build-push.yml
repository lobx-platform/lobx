name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v7
      with:
        context: ./back
        file: ./docker/Dockerfile.back
        push: true
        tags: |
          ghcr.io/lobx-platform/trading_platform:back
          ghcr.io/lobx-platform/trading_platform:back-${{ github.sha }}

  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - name: Deploy to Durham server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        script: |
          set -e
          cd /root/trading_platform
          touch .env

          upsert_env_var() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Skipping $name because value is empty"
              return
            fi
            grep -q "^${name}=" .env 2>/dev/null \
              && sed -i "s|^${name}=.*|${name}=${value}|" .env \
              || echo "${name}=${value}" >> .env
          }

          upsert_env_var ADMIN_PASSWORD '${{ secrets.ADMIN_PASSWORD }}'
          upsert_env_var NGROK_AUTHTOKEN '${{ secrets.NGROK_AUTHTOKEN }}'

          # Log in to ghcr.io with the workflow's own short-lived token. It expires
          # when this job ends, so no long-lived registry credential is ever stored
          # on the server. Log out again below so nothing is left behind at all.
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io \
            --username '${{ github.actor }}' \
            --password-stdin

          chmod +x ./deploy.sh
          # 'set -e' would abort before the logout below if deploy.sh failed, so run
          # it as an if-condition: that keeps the exit code without tripping set -e.
          if ./deploy.sh; then rc=0; else rc=$?; fi

          docker logout ghcr.io || true
          exit $rc

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: front/yarn.lock

    - name: Install dependencies
      run: cd front && yarn install --frozen-lockfile

    - name: Build frontend
      run: cd front && yarn build
      env:
        VITE_HTTP_URL: https://lobx.ngrok.app/

    - name: Deploy to Firebase
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: london-trader
        channelId: live
        entryPoint: ./front
