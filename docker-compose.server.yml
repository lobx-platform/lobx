# Production docker-compose for Durham server
# Uses pre-built images from the GitHub Container Registry - no local building required

services:
  back:
    image: ghcr.io/lobx-platform/trading_platform:back
    volumes:
      - ./.env:/app/.env:ro
      - ./back/config:/app/config:Z
      - ./back/logs:/app/logs:Z
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - ROOT_PATH=
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD_required}
    command: sh -c 'uv run uvicorn api.endpoints:app --host 0.0.0.0 --port 8000 --root-path "$${ROOT_PATH:-}"'
    restart: unless-stopped
    networks:
      - server-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    build:
      context: .
      dockerfile: docker/Dockerfile.ngrok
    restart: unless-stopped
    command:
      - "http"
      - "localhost:8000"
      - "--hostname"
      - "${NGROK_DOMAIN:-lobx.ngrok.app}"
      - "--authtoken"
      - "${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN_required}"
    network_mode: host
    depends_on:
      - back
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  server-network:
    name: trading_platform_server
    driver: bridge
